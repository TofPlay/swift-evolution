name: Déploiement GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Upload de l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site' # Indique ici que votre site est dans le dossier _site

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   
